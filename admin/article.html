<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Articles | Bibek Joshi</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="./admin.css">

          <div class="article-actions">

    <a
        href="../blog.html"
        target="_blank"
        class="btn view-btn">

        <i class="fa-solid fa-eye"></i>
        View Website

    </a>

    <a
        href="edit-article.html?id=${encodeURIComponent(article.id)}"
        class="btn">

        <i class="fa-solid fa-pen"></i>
        Edit

    </a>

    <button
        type="button"
        class="btn delete-btn"
        data-id="${escapeAttribute(article.id)}"
        data-title="${escapeAttribute(article.title)}">

        <i class="fa-solid fa-trash"></i>
        Delete

    </button>

</div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- IMPORTANT: NO / AFTER supabase.js -->
    <script src="supabase.js"></script>

</head>
