<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Article | Bibek Joshi</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="admin.css">

</head>

<body class="admin-page">

<header class="admin-header">

    <div>
        <h1>
            <i class="fa-solid fa-pen-to-square"></i>
            Create Article
        </h1>

        <p>
            Write and publish a new article.
        </p>
    </div>

    <div class="header-buttons">

        <a href="admin.html" class="btn">
            <i class="fa-solid fa-arrow-left"></i>
            Dashboard
        </a>

        <a href="articles.html" class="btn">
            Articles
        </a>

    </div>

</header>


<main class="editor-container">

<form id="articleForm" class="article-editor">

    <div class="editor-main">

        <!-- Title -->

        <div class="form-group">

            <label for="title">
                Article Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter article title"
                required
            >

        </div>


        <!-- Slug -->

        <div class="form-group">

            <label for="slug">
                URL Slug
            </label>

            <input
                type="text"
                id="slug"
                placeholder="article-title"
                required
            >

            <small>
                Example:
                cybersecurity-in-the-digital-age
            </small>

        </div>


        <!-- Excerpt -->

        <div class="form-group">

            <label for="excerpt">
                Excerpt
            </label>

            <textarea
                id="excerpt"
                rows="4"
                placeholder="Short description of your article..."
            ></textarea>

        </div>

        <div class="form-group">

                Article Content

            <textarea

                    Cybersecurity

                    AI

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- IMPORTANT:
     create-article.html is inside /admin/
     supabase.js is in the main portfolio folder.
-->

<script src="../supabase.js"></script>


<script>

    // ==========================================
    // CHECK SUPABASE CONNECTION
    // ==========================================

    if (!window.supabaseClient) {

        console.error(
            "Supabase client was not found."
        );

        document.getElementById("message").textContent =
            "❌ Supabase connection could not be loaded.";

    }


    // ==========================================
    // AUTH CHECK
    // ==========================================

    async function checkAuth() {

        try {

            if (!window.supabaseClient) {
                return;
            }

            const {
                data: {
                    session
                },
                error
            } = await window.supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Authentication error:",
                    error
                );

                return;

            }


            if (!session) {

                window.location.href =
                    "login.html";

            }

        } catch (error) {

            console.error(
                "Auth check failed:",
                error
            );

        }

    }


    checkAuth();


    // ==========================================
    // AUTO SLUG
    // ==========================================

    const titleInput =
        document.getElementById("title");

    const slugInput =
        document.getElementById("slug");


    titleInput.addEventListener(
        "input",
        () => {

            if (!slugInput.dataset.edited) {

                slugInput.value =
                    titleInput.value
                        .toLowerCase()
                        .trim()
                        .replace(
                            /[^a-z0-9\s-]/g,
                            ""
                        )
                        .replace(
                            /\s+/g,
                            "-"
                        )
                        .replace(
                            /-+/g,
                            "-"
                        );

            }

        }
    );


    slugInput.addEventListener(
        "input",
        () => {

            slugInput.dataset.edited =
                "true";

        }
    );


    // ==========================================
    // CREATE ARTICLE
    // ==========================================

    document
        .getElementById("articleForm")
        .addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const button =
                    document.getElementById(
                        "publishBtn"
                    );

                const message =
                    document.getElementById(
                        "message"
                    );


                // Check Supabase

                if (!window.supabaseClient) {

                    message.textContent =
                        "❌ Supabase is not connected.";

                    message.className =
                        "editor-message error";

                    return;

                }


                button.disabled = true;

                button.innerHTML =
                    `<i class="fa-solid fa-spinner fa-spin"></i>
                     Publishing...`;


                // ==========================================
                // ARTICLE DATA
                // ==========================================

                const article = {

                    title:
                        titleInput.value.trim(),

                    slug:
                        slugInput.value.trim(),

                    category:
                        document
                            .getElementById("category")
                            .value,

                    excerpt:
                        document
                            .getElementById("excerpt")
                            .value
                            .trim(),

                    content:
                        document
                            .getElementById("content")
                            .value,

                    image_url:
                        document
                            .getElementById("image_url")
                            .value
                            .trim() || null,

                    author:
                        document
                            .getElementById("author")
                            .value
                            .trim() ||
                        "Bibek Joshi",

                    seo_title:
                        document
                            .getElementById("seo_title")
                            .value
                            .trim() || null,

                    seo_description:
                        document
                            .getElementById("seo_description")
                            .value
                            .trim() || null,

                    seo_keywords:
                        document
                            .getElementById("seo_keywords")
                            .value
                            .trim() || null,

                    published:
                        document
                            .getElementById("published")
                            .checked

                };


                // ==========================================
                // INSERT ARTICLE
                // ==========================================

                try {

                    const {
                        data,
                        error
                    } =
                        await window
                            .supabaseClient
                            .from("articles")
                            .insert([article])
                            .select();


                    if (error) {

                        console.error(
                            "Supabase error:",
                            error
                        );

                        message.textContent =
                            "❌ " +
                            error.message;

                        message.className =
                            "editor-message error";

                        resetButton();

                        return;

                    }


                    console.log(
                        "Article created:",
                        data
                    );


                    message.textContent =
                        "✅ Article published successfully!";

                    message.className =
                        "editor-message success";


                    setTimeout(
                        () => {

                            window.location.href =
                                "articles.html";

                        },
                        1000
                    );


                } catch (error) {

                    console.error(
                        "Publishing error:",
                        error
                    );


                    message.textContent =
                        "❌ " +
                        (error.message ||
                         "Something went wrong.");

                    message.className =
                        "editor-message error";


                    resetButton();

                }


                // ==========================================
                // RESET BUTTON
                // ==========================================

                function resetButton() {

                    button.disabled = false;

                    button.innerHTML =
                        `<i class="fa-solid fa-paper-plane"></i>
                         Publish Article`;

                }

            }
        );

</script>

</body>

</html>
