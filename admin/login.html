        * {
            margin: 0;
            padding: 0;

        body {

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at top left,
                    #3b82f6 0%,

                radial-gradient(
                    circle at bottom right,
                    #8b5cf6 0%,

                #0f172a;

            padding: 20px;

        /* Decorative background circles */

        body::before {

            content: "";

            border-radius: 50%;

            background:

            top: -120px;

        body::after {

            bottom: -120px;

            left: -100px;

        }


        /* Main login wrapper */

        .login-wrapper {

            min-height: 560px;

            grid-template-columns:
                1fr 1fr;

                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 24px;

            overflow: hidden;

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.35);

            position: relative;

        }

<body>


<div class="login-wrapper">


    <!-- LEFT GRAPHIC -->

    <div class="login-graphic">

        <div class="graphic-icon">

            <i class="fa-solid fa-shield-halved"></i>

        </div>


        <h2>
            Bibek Joshi
        </h2>


        <p>
            Welcome to your private
            content management dashboard.
            Manage articles, publish content
            and keep your portfolio updated.
        </p>


        <div class="security-badge">

            <i class="fa-solid fa-lock"></i>

            Secure Admin Area

        </div>

    </div>


    <!-- RIGHT LOGIN -->

    <div class="login-form-area">


        <div class="login-header">

            <div class="small-title">
                Administrator
            </div>

            <h1>
                Admin Login
            </h1>

            <p>
                Sign in to manage your articles
            </p>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton">

                <i class="fa-solid fa-right-to-bracket"></i>

                &nbsp; Login

            </button>


            <p
                id="loginMessage"
                class="login-message">
            </p>


        </form>


        <div class="back-link">

            <a href="../index.html">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Portfolio

            </a>

        </div>


    </div>


</div>



<script>


const loginForm =
    document.getElementById("loginForm");


const loginButton =
    document.getElementById("loginButton");


const loginMessage =
    document.getElementById("loginMessage");



loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
            .value
            .trim();


        const password =
            document.getElementById("password")
            .value;


        loginButton.disabled = true;


        loginButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';


        loginMessage.textContent = "";


        try {


            const {
                data,
                error
            } =
                await window.supabaseClient
                .auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                console.error(
                    "Login error:",
                    error
                );


                loginMessage.textContent =
                    "❌ " + error.message;


                loginButton.disabled =
                    false;


                loginButton.innerHTML =
                    '<i class="fa-solid fa-right-to-bracket"></i> &nbsp; Login';


                return;

            }


            console.log(
                "Login successful:",
                data
            );


            loginMessage.textContent =
                "✅ Login successful!";


            loginButton.innerHTML =
                '<i class="fa-solid fa-check"></i> Logged in';


            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 700);


        }

        catch (error) {

            console.error(error);


            loginMessage.textContent =
                "❌ Something went wrong.";


            loginButton.disabled =
                false;


            loginButton.innerHTML =
                '<i class="fa-solid fa-right-to-bracket"></i> &nbsp; Login';

        }

    }
);

</script>


</body>

</html>
